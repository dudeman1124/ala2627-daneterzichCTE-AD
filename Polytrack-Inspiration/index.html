<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vector Run</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="kicker">TIME TRIAL / 01</p>
        <h1>Vector Run</h1>
      </div>
      <div class="status"><span class="status-dot"></span> LIVE COURSE</div>
    </header>

    <section class="game-frame" aria-label="Vector Run racing game">
      <canvas id="game" tabindex="0" aria-label="Third-person 3D racing track"></canvas>
      <div class="hud hud-left">
        <span class="hud-label">LAP</span>
        <strong id="lap">1 / 3</strong>
      </div>
      <div class="hud hud-right">
        <span class="hud-label">TIME</span>
        <strong id="time">00:00.000</strong>
      </div>
      <div class="hud hud-bottom">
        <span><b id="speed">0</b> KM/H</span>
        <span>BEST <b id="best">--:--.---</b></span>
      </div>
      <div id="message" class="message">READY?</div>
    </section>

    <footer class="controls">
      <div><kbd>W</kbd> ACCELERATE <kbd>S</kbd> REVERSE</div>
      <div><kbd>A</kbd><kbd>D</kbd> STEER</div>
      <div><kbd>SPACE</kbd> BRAKE</div>
      <div><kbd>ESC</kbd> PAUSE</div>
      <div><kbd>R</kbd> RESET RUN</div>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>

</html>
